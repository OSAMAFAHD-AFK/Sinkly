name: sinkly
description: "Sinkly — clean the sink, unlock your apps. Guilt-free scrolling, earned."
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.13.2

dependencies:
  cupertino_icons: ^2.0.0
  dartz: ^0.10.1
  equatable: ^3.0.0
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  get_it: ^9.3.0
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  http: ^1.6.0
  image_picker: ^1.2.4
  in_app_review: ^2.0.12
  purchases_flutter: ^10.16.0
  purchases_ui_flutter: 10.16.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    # Cairo + Plus Jakarta Sans shipped inside the app (google_fonts finds them
    # here, so nothing is downloaded and first launch offline looks right).
    - assets/google_fonts/
