name: sinkly
description: "Sinkly — clean the sink, unlock your apps. Guilt-free scrolling, earned."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cupertino_icons: ^2.0.0
  dartz: ^0.10.1
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  get_it: ^9.3.0
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
