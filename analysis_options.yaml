include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # Main screen files intentionally follow the `[Feature]View.dart` convention
    # (e.g. OnboardingView.dart) required by the project structure.
    file_names: false
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    avoid_print: true
